<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e14">
  <meta name="color-scheme" content="dark">
  <title>Knowledge Cards</title>
  <link rel="stylesheet" href="styles.css?v=2">
  <script src="card-content.js?v=2" defer></script>
  <script src="viewer.js?v=2" defer></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-dot" aria-hidden="true"></span> Knowledge Cards</div>
      <a class="download" href="book.epub" download aria-label="下载适用于 X3 的 EPUB">EPUB <span aria-hidden="true">↓</span></a>
    </header>

    <section class="stage" id="card-stage" aria-label="随机知识卡片">
      <p class="status" id="message" role="status">正在加载卡片…</p>
      <article id="card" class="card-content" hidden aria-live="polite">
        <span class="card-index" id="card-index"></span>
        <div class="card-body" id="card-body"></div>
      </article>
    </section>

    <nav class="controls" aria-label="切换卡片">
      <button class="page-btn" type="button" id="previous" aria-label="上一张卡片" disabled>
        <span aria-hidden="true">←</span>
      </button>
      <span class="position" id="position" aria-live="polite">— / —</span>
      <button class="page-btn" type="button" id="next" aria-label="下一张卡片" disabled>
        <span aria-hidden="true">→</span>
      </button>
    </nav>
  </main>
</body>
</html>
